services:
  vm-panel:
    image: python:3.12-alpine
    container_name: vm-panel
    restart: unless-stopped
    network_mode: host
    pid: host
    cap_add:
      - SYS_PTRACE
    working_dir: /app
    command: ["python", "/app/server.py"]
    environment:
      - PANEL_PORT=8090
      - DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      - ./app:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
