volumes:
  painel-cache:

services:
  painel-servicos:
    image: python:3.12-alpine
    container_name: painel-servicos
    restart: unless-stopped
    network_mode: host
    pid: host
    cap_add:
      - SYS_PTRACE
    working_dir: /app
    command: ["python", "/app/server.py"]
    environment:
      - PANEL_PORT=${PANEL_PORT:-8090}
      - PANEL_BIND=${PANEL_BIND:-0.0.0.0}
      - DOCKER_SOCKET=${DOCKER_SOCKET:-/var/run/docker.sock}
      - PANEL_USER=${PANEL_USER:-admin}
      - PANEL_PASSWORD=${PANEL_PASSWORD:-}
      - PANEL_HTTPS_PORTS=${PANEL_HTTPS_PORTS:-443,8443,9443}
      - PANEL_PROBE_INTERVAL=${PANEL_PROBE_INTERVAL:-60}
      - PANEL_PROBE_TTL=${PANEL_PROBE_TTL:-300}
      - PANEL_PROBE_TIMEOUT=${PANEL_PROBE_TIMEOUT:-2.0}
      - PANEL_CACHE_FILE=${PANEL_CACHE_FILE:-/cache/cache.json}
    volumes:
      - ./app:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - painel-cache:/cache